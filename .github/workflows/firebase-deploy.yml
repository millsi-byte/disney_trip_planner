name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/disney-trip-planner-design-p89zx9
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Authenticate once via the service account (Application Default
      # Credentials). The FirebaseExtended action has no retry: a single dropped
      # connection to Google's OAuth token endpoint ("Premature close") fails the
      # whole deploy, which is intermittent on GitHub runners.
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Hosting (retry on transient auth failures)
        run: |
          n=0; max=5
          until [ "$n" -ge "$max" ]; do
            if npx -y firebase-tools@latest deploy --only hosting --project disney-trip-planner-447d7 --non-interactive; then
              echo "Hosting deploy succeeded on attempt $((n+1))."; exit 0
            fi
            n=$((n+1))
            [ "$n" -lt "$max" ] && { w=$((n*15)); echo "Hosting attempt $n failed; retrying in ${w}s..."; sleep "$w"; }
          done
          echo "All $max hosting deploy attempts failed."; exit 1

      # Deploy the Firestore security rules from firestore.rules. This is what
      # lets the super-admin list every workspace (tenant). Kept as its own step
      # with continue-on-error so that if the service account lacks the Firebase
      # Rules admin role, hosting still ships and the failure is visible in logs
      # (grant roles/firebaserules.admin to the SA to enable this).
      - name: Deploy Firestore rules (retry on transient auth failures)
        continue-on-error: true
        run: |
          n=0; max=5
          until [ "$n" -ge "$max" ]; do
            if npx -y firebase-tools@latest deploy --only firestore:rules --project disney-trip-planner-447d7 --non-interactive; then
              echo "Firestore rules deploy succeeded on attempt $((n+1))."; exit 0
            fi
            n=$((n+1))
            [ "$n" -lt "$max" ] && { w=$((n*15)); echo "Rules attempt $n failed; retrying in ${w}s..."; sleep "$w"; }
          done
          echo "All $max firestore rules deploy attempts failed."; exit 1

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
