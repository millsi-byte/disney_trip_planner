<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Baseline Tap</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseline Tap">
<meta name="theme-color" content="#1B2B4A">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Load Google Fonts non-blocking: a render-blocking stylesheet from
     fonts.googleapis.com freezes the whole page if a browser stalls the
     request (Edge/Safari tracking prevention can hang Google domains for
     minutes). media="print" → swap to "all" onload lets the page paint
     immediately with system fonts and upgrade when (if) the font arrives. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root">
  <div id="header-host"></div>
  <div id="strip-host"></div>
  <div id="filter-host"></div>
  <main id="app"></main>
  <nav class="bnav" id="bnav"></nav>
</div>
<div id="sheet-host"></div>
<div id="screen-host"></div>
<div id="toast" class="toast"></div>

<!-- All deferred: scripts download in the background and execute in order
     after the page has parsed, so a slow CDN (the Firebase SDK on a poor
     network/proxy) can never block the login screen from rendering. defer
     preserves order, so data.js → app.js → firebase → cloud.js still load in
     sequence and dependencies hold. -->
<script defer src="js/data.js"></script>
<script defer src="js/app.js"></script>
<!-- Firebase cloud sync (optional — app falls back to local if these don't load).
     SELF-HOSTED: served from our own origin, not gstatic.com. The Google CDN
     gets stalled for minutes by some networks/proxies and by Edge/Safari
     tracking prevention, which is what made sign-in hang. Same-origin means
     they load over the same fast path as the app and the service worker caches
     them, so sign-in is fast and works in private windows. -->
<script defer src="vendor/firebase/firebase-app-compat.js"></script>
<script defer src="vendor/firebase/firebase-auth-compat.js"></script>
<script defer src="vendor/firebase/firebase-firestore-compat.js"></script>
<script defer src="js/firebase-config.js"></script>
<script defer src="js/cloud.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
